<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#044794" />
    <meta name="description" content="Scaffold: your day, your ideas and Filo, your little builder buddy." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scaffold" />
    <title>Scaffold</title>
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/app/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-top" id="top"></header>
      <main class="app-sheet" id="sheet" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Sections">
        <button type="button" class="tab" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3" /><path d="M8 3v4M16 3v4M4 10h16" /><circle cx="12" cy="15" r="1.6" fill="currentColor" /></svg><span>Today</span></button>
        <button type="button" class="tab" data-view="ideas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" /></svg><span>Ideas</span></button>
        <button type="button" class="capture-button" aria-label="Capture a task, idea or thought">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></svg>
        </button>
        <button type="button" class="tab" data-view="thoughts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17.5a4.5 4.5 0 0 1-.7-8.9A5.5 5.5 0 0 1 17 7.5a4 4 0 0 1 .5 8z" /><circle cx="6" cy="21" r="1.2" /><circle cx="9.5" cy="19.5" r="1.4" /></svg><span>Thoughts</span></button>
        <button type="button" class="tab" data-view="filo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 13a6 6 0 0 1 12 0v2a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z" /><path d="M7.5 9.5 6 5l4 2.5M16.5 9.5 18 5l-4 2.5" /><circle cx="10" cy="13" r=".9" fill="currentColor" /><circle cx="14" cy="13" r=".9" fill="currentColor" /></svg><span>Filo</span></button>
      </nav>

      <div class="modal" id="capture" hidden>
        <div class="modal-scrim"></div>
        <section class="modal-sheet capture-sheet" role="dialog" aria-modal="true" aria-labelledby="capture-title" tabindex="-1">
          <span class="grabber" aria-hidden="true"></span>
          <header class="modal-head">
            <h2 id="capture-title">Capture</h2>
            <button type="button" class="icon-button" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
          </header>
          <p class="capture-lead">Say or type anything. Filo sorts it into tasks, ideas and thoughts.</p>
          <div class="mic-area">
            <div class="mic-filo" aria-hidden="true"></div>
            <button type="button" class="mic" aria-pressed="false" aria-label="Start voice capture">
              <span class="mic-ring"></span><span class="mic-ring"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" /></svg>
            </button>
            <p class="mic-status" aria-live="polite">Tap to talk</p>
          </div>
          <label class="sr-only" for="capture-text">What's on your mind?</label>
          <textarea id="capture-text" rows="3" placeholder="e.g. Call Sam tomorrow at 10am. What if Filo had a focus mode? Feeling good about the launch."></textarea>
          <div class="examples">
            <p>Try one</p>
            <button type="button" class="chip" data-example="Book the dentist on Friday at 9am and also what if the week strip showed the weather">Dentist + an idea</button>
            <button type="button" class="chip" data-example="I need to send the invoice tonight. Feeling proud of how the team handled the launch">Invoice + a feeling</button>
            <button type="button" class="chip" data-example="gym tomorrow at 7 for 1 hour maybe we could add streak badges i think mornings are my best focus time">Spoken ramble</button>
          </div>
          <section class="sorted" hidden>
            <h3>Filo sorted <span class="sorted-count"></span><span class="sorted-hint">Tap a label to change it</span></h3>
            <ul class="sorted-list"></ul>
          </section>
          <button type="button" class="primary save-capture" disabled>Save</button>
        </section>
      </div>

      <div class="modal" id="editor" hidden>
        <div class="modal-scrim"></div>
        <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title" tabindex="-1">
          <span class="grabber" aria-hidden="true"></span>
          <form class="editor-form">
            <header class="modal-head">
              <h2 id="editor-title">Edit task</h2>
              <button type="button" class="icon-button" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
            </header>
            <label class="field">Task<input name="title" type="text" maxlength="120" autocomplete="off" required /></label>
            <div class="field-row">
              <label class="field">Day<input name="date" type="date" required /></label>
              <label class="field">Time<input name="time" type="time" step="300" /></label>
            </div>
            <label class="toggle-field"><input name="anytime" type="checkbox" /> Anytime that day</label>
            <fieldset class="field">
              <legend>Duration</legend>
              <div class="segmented">
                <label><input type="radio" name="duration" value="15" />15m</label>
                <label><input type="radio" name="duration" value="30" />30m</label>
                <label><input type="radio" name="duration" value="45" />45m</label>
                <label><input type="radio" name="duration" value="60" />1h</label>
                <label><input type="radio" name="duration" value="90" />1.5h</label>
              </div>
            </fieldset>
            <fieldset class="field">
              <legend>Tag</legend>
              <div class="tag-picker">
                <label><input type="radio" name="tag" value="Work" /><span class="tag tag-work">Work</span></label>
                <label><input type="radio" name="tag" value="Personal" /><span class="tag tag-personal">Personal</span></label>
                <label><input type="radio" name="tag" value="Health" /><span class="tag tag-health">Health</span></label>
                <label><input type="radio" name="tag" value="Learning" /><span class="tag tag-learning">Learning</span></label>
                <label><input type="radio" name="tag" value="General" /><span class="tag tag-general">General</span></label>
              </div>
            </fieldset>
            <div class="editor-actions">
              <button type="button" class="danger-button" data-action="delete-task">Delete</button>
              <button type="submit" class="primary">Save task</button>
            </div>
          </form>
        </section>
      </div>

      <p class="toast" id="toast" role="status" hidden></p>
    </div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
